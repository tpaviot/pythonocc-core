# pip/wheel build of pythonocc-core (scikit-build-core).
#
# SWIG (>= 4.5.1) and OpenCASCADE (== 8.0.1) must be available on the build
# machine: the swig package on PyPI does not ship 4.5.1 yet, and OCCT is
# not available on PyPI. The PyPI wheels are built by cibuildwheel, see the
# [tool.cibuildwheel] section below and .github/workflows/wheels.yml.
[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pythonocc-core"
dynamic = ["version"]
description = "Python package for 3D geometry CAD/BIM/CAM"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thomas Paviot", email = "tpaviot@gmail.com" }]
requires-python = ">=3.10"
# built against numpy 2.x, which remains compatible with numpy >= 1.19 at runtime
dependencies = ["numpy>=1.19"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
qt = ["PySide6>=6.10"]
svg = ["svgwrite>=1.4"]
test = ["pytest", "mypy", "svgwrite>=1.4"]

[project.urls]
Homepage = "https://github.com/tpaviot/pythonocc-core"
Repository = "https://github.com/tpaviot/pythonocc-core"
Issues = "https://github.com/tpaviot/pythonocc-core/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.18"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
# everything is installed by CMakeLists.txt
wheel.packages = []
sdist.exclude = [
    ".github",
    "ci",
    "sandbox",
    # files generated by the test suite
    "test/test_io/sample*",
    "test/test_io/*_generated.*",
    "test/test_io/sphere.x3d",
    "test/test_io/torus.x3d",
]

[tool.scikit-build.cmake.define]
PYTHONOCC_MESHDS_NUMPY = "ON"
SWIG_HIDE_WARNINGS = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?sx)
set\(PYTHONOCC_VERSION_MAJOR\s+(?P<major>\d+)\).*?
set\(PYTHONOCC_VERSION_MINOR\s+(?P<minor>\d+)\).*?
set\(PYTHONOCC_VERSION_PATCH\s+(?P<patch>\d+)\).*?
set\(PYTHONOCC_VERSION_DEVEL\s*(?P<devel>[^)\s]*)\s*\)
'''
# PYTHONOCC_VERSION_DEVEL is empty for the official releases
result = "{major}.{minor}.{patch}{devel}"

# cibuildwheel configuration of the PyPI wheels, used by
# .github/workflows/wheels.yml. The native dependencies (SWIG, OCCT and its
# 3rd parties) are built by the scripts in ci/wheels/deps/.
[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
build-verbosity = 1
test-requires = ["pytest", "svgwrite>=1.4"]
test-sources = ["test"]
# the tests use paths relative to the test directory
test-command = "python -c \"import os, sys, pytest; os.chdir('test'); sys.exit(pytest.main(['-q', '-p', 'no:cacheprovider']))\""

[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# SWIG and OCCT are built from sources in the container (or restored from
# the PYOCC_DEPS_CACHE tarball), auditwheel then vendors the libraries
before-all = "bash {project}/ci/wheels/deps/linux.sh"
environment-pass = ["PYOCC_DEPS_CACHE"]

[tool.cibuildwheel.linux.environment]
PATH = "/opt/pyocc-deps/bin:$PATH"
CMAKE_PREFIX_PATH = "/opt/pyocc-deps"
LD_LIBRARY_PATH = "/opt/pyocc-deps/lib:$LD_LIBRARY_PATH"
# RapidJSON headers, included by the OCCT glTF headers
CPLUS_INCLUDE_PATH = "/opt/pyocc-deps/include"

# macOS and Windows: the dependencies are built on the runner by
# ci/wheels/deps/macos.sh and ci/wheels/deps/windows.ps1, and installed
# to $PYOCC_DEPS_PREFIX

[tool.cibuildwheel.macos]
repair-wheel-command = "DYLD_LIBRARY_PATH=$PYOCC_DEPS_PREFIX/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.macos.environment]
PATH = "$PYOCC_DEPS_PREFIX/bin:$PATH"
CMAKE_PREFIX_PATH = "$PYOCC_DEPS_PREFIX"
# must match ci/wheels/deps/macos.sh and ci/wheels/triplets/*-osx-pyocc.cmake
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path %PYOCC_DEPS_PREFIX%/bin -w {dest_dir} {wheel}"

[tool.cibuildwheel.windows.environment]
PATH = "$PYOCC_DEPS_PREFIX/swig;$PATH"
CMAKE_PREFIX_PATH = "$PYOCC_DEPS_PREFIX"
